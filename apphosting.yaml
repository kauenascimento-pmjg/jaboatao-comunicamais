# Firebase App Hosting Configuration
# Documentation: https://firebase.google.com/docs/app-hosting/configure

kind: "AppHostingYaml"
schemaVersion: "v1"

# Caminho para a pasta do frontend
rootDirectory: "frontend"

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80

# Variáveis de Ambiente Necessárias para o Build do Next.js
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyBL65DOZSXJ2mTuQffzZGqxtjuP2PwxvRg"
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "pmjg-apps-hmol.firebaseapp.com"
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "pmjg-apps-hmol"
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "pmjg-apps-hmol.firebasestorage.app"
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "855576282066"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:855576282066:web:ccc776bbb13db2653fbe0b"
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: "G-58H6ZG1BT9"
  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_ID
    value: "comunica-mais-jaboatao"
  - variable: NEXT_PUBLIC_BACKEND_URL
    value: "https://comunica-mais-jaboatao--pmjg-apps-hmol.us-central1.hosted.app" # Mudar para a URL de produção quando disponível
